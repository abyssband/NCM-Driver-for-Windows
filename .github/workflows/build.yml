name: Build NCM Driver

# ⚠️ This workflow is currently EXPERIMENTAL and not auto-triggered.
#
# The EWDK ISO has no programmatic direct download URL (Microsoft's portal
# requires interactive license acceptance), and the regular WDK installer
# requires VS 2026 which is not yet on windows-2022 runners. WDK NuGet
# packages exist (10.0.26100.1+) but would require modifying upstream
# .vcxproj files which we're trying to keep clean for upstream sync.
#
# When the windows-2025 / windows-2026 runner image lands with VS 2026 +
# WDK preinstalled, change the runner image and re-enable on:push.
#
# In the meantime: build locally per APPLE_QUIRK_README.md.

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

env:
  SOLUTION_FILE: usbncm.sln
  PLATFORM: x64
  CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Probe runner toolchain
        shell: pwsh
        run: |
          Write-Host "=== Visual Studio ==="
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vsWhere) {
            & $vsWhere -latest -property catalog_productDisplayVersion
          }
          Write-Host "=== Windows Kits ==="
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^\d+\.\d+' } | Select-Object Name
          Write-Host "=== WDK probe ==="
          $wdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Lib" -ErrorAction SilentlyContinue
          if ($wdk) { $wdk.Name } else { "WDK not present on this runner image" }

      - name: Build (best-effort)
        shell: pwsh
        run: |
          # Without WDK, this will fail at the host\ project. Logs help us
          # understand exactly what's missing on the runner image.
          try {
            msbuild "$env:SOLUTION_FILE" `
              /p:Configuration=$env:CONFIGURATION `
              /p:Platform=$env:PLATFORM `
              /m /v:minimal /nologo
          } catch {
            Write-Warning "Build failed — see APPLE_QUIRK_README.md for local build."
            exit 1
          }

      - name: Upload artifacts (if any built)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UsbNcmSample-${{ github.sha }}
          path: |
            x64/**/UsbNcmSample.sys
            x64/**/UsbNcmSample.inf
            x64/**/UsbNcmSample.pdb
            APPLE_QUIRK_README.md
            LICENSE
          if-no-files-found: error
          retention-days: 30
